name: CI

on:
  push:
    branches: [main, "sprint-*/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: ML tests (includes the frozen-hash checks in tests/test_freeze.py)
        run: python -m pytest -q tests

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway database on the runner, reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_NAME: salesmesh_fraud_detection_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies (runtime and test packages)
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Generate per-run secrets (never stored in the repository)
        run: |
          for name in FLASK_SECRET_KEY DB_PASSWORD DEMO_ANALYST_PASSWORD DEMO_COMPLIANCE_PASSWORD DEMO_ADMIN_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Backend tests
        run: python -m pytest -q

  # Issue #20: the pinned libraries inside the built image reproduce the frozen scores. The repository's ml/
  # and backend/tests are mounted read only; they are never part of the runtime image.
  image-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the test image (runtime image plus pytest)
        run: docker build -f backend/Dockerfile --target test -t salesmesh-api-test .
      - name: Generate per-run secrets (never stored in the repository)
        run: |
          for name in FLASK_SECRET_KEY DB_PASSWORD DEMO_ANALYST_PASSWORD DEMO_COMPLIANCE_PASSWORD DEMO_ADMIN_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Library versions in the image
        run: docker run --rm salesmesh-api-test python -c "import numpy, pandas, scipy, sklearn, joblib; print(numpy.__version__, pandas.__version__, scipy.__version__, sklearn.__version__, joblib.__version__)"
      - name: Parity with the frozen scores, inside the image
        run: >-
          docker run --rm --network host
          -e DB_HOST=localhost -e DB_PORT=5432 -e DB_USER=postgres -e DB_NAME=salesmesh_fraud_detection_test
          -e DB_PASSWORD -e FLASK_SECRET_KEY -e DEMO_ANALYST_PASSWORD -e DEMO_COMPLIANCE_PASSWORD -e DEMO_ADMIN_PASSWORD
          -v "$PWD/ml:/app/ml:ro" -v "$PWD/backend/tests:/app/backend/tests:ro"
          salesmesh-api-test python -m pytest -q -p no:cacheprovider tests/test_parity.py
      - name: Frozen file hashes, inside the image
        run: >-
          docker run --rm -v "$PWD/ml:/app/ml:ro" -w /app/ml
          salesmesh-api-test python -m pytest -q -p no:cacheprovider tests/test_freeze.py

  # Issue #20: the whole compose stack on a throwaway database, then the smoke test. Uses no deployment
  # secrets; every value is generated for this run.
  deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write a throwaway env file
        run: |
          cp deploy/.env.production.example deploy/.env.production
          for name in FLASK_SECRET_KEY CUSTOMER_REF_KEY DB_PASSWORD; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            sed -i "s/^$name=.*/$name=$value/" deploy/.env.production
          done
          value="$(openssl rand -hex 24)"
          echo "::add-mask::$value"
          echo "SMOKE_PASSWORD=$value" >> "$GITHUB_ENV"
      - name: Build the images
        run: docker compose build
      - name: First time setup (migrate, load, first admin, first detection run)
        env:
          ADMIN_PASSWORD: ${{ env.SMOKE_PASSWORD }}
        run: |
          docker compose up -d --wait db
          docker compose run --rm api python -m src.migrate
          docker compose --profile setup run --rm load-data
          docker compose run --rm -e ADMIN_PASSWORD api python -m src.manage_accounts create-admin smoke_admin --password-env ADMIN_PASSWORD
          docker compose run --rm api python -m src.pipeline
      - name: Start the stack
        run: docker compose up -d --wait
      - name: Smoke test
        env:
          SMOKE_USERNAME: smoke_admin
        run: python3 deploy/smoke_test.py https://localhost --insecure
      - name: The scheduler records a run
        run: |
          for attempt in $(seq 1 60); do
            count="$(docker compose exec -T db sh -c 'psql -U "$DB_USER" -d "$DB_NAME" -tAc "SELECT count(*) FROM detection_runs WHERE trigger = '"'"'scheduler'"'"' AND status = '"'"'succeeded'"'"'"')"
            [ "$count" -ge 1 ] && echo "scheduler runs: $count" && exit 0
            sleep 5
          done
          docker compose logs scheduler
          exit 1
      - name: Restart and recover
        run: |
          docker compose restart api
          docker compose up -d --wait
          curl --fail --insecure https://localhost/api/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
